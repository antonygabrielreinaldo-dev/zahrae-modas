{% extends "base.html" %}
{% block title %}Área do lojista — Zahrae Modas{% endblock %}
{% block content %}
<div class="container">
  <form class="form-card" method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Área do lojista</h1>
    <p class="sub">Entre para gerenciar o catálogo de peças.</p>
    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <div class="input-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="icon-btn reveal-pass" type="button" aria-label="Mostrar senha" aria-pressed="false">
          <svg class="ico eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ico eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.2A9.8 9.8 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.4 7.5A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
    </div>
    <button class="btn btn-dark btn-block" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
